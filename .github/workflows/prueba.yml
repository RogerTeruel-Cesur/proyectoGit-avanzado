# Nombre que veremos en GitHub Actions
name: Comprobacion de tokens con Self-Hosted Runner

# Cada vez que hacemos un push se ejecuta el workflow
on:
  push:

jobs:
  comprobar-token:

    # Lo ejecuta en nuestro propio PC, usando el runner RODHAMMER
    runs-on: self-hosted

    steps:

      - name: Comparar DEV_TOKEN

        # Nuestro runner es Windows, así que usamos PowerShell
        shell: powershell

        env:
          # Cogemos el Secret DEV_TOKEN guardado en GitHub
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}

          # Cogemos LOCAL_DEV_TOKEN de las variables de Windows
          LOCAL_DEV_TOKEN: $env:LOCAL_DEV_TOKEN

        run: |

          # Comprobamos si los dos valores son iguales
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {

            # Si coinciden, la prueba termina correctamente
            Write-Host "OK: Los tokens coinciden"

          }
          else {

            # Si no coinciden, mostramos el error
            Write-Host "ERROR: Los tokens NO coinciden"

            # Hace que GitHub marque el job como fallido
            exit 1
          }